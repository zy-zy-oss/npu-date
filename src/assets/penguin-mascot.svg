<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <!-- 企鹅身体 -->
  <ellipse cx="200" cy="280" rx="120" ry="140" fill="#000"/>
  
  <!-- 企鹅头 -->
  <circle cx="200" cy="150" r="100" fill="#000"/>
  
  <!-- 企鹅肚子（白色） -->
  <ellipse cx="200" cy="280" rx="70" ry="100" fill="#fff"/>
  
  <!-- 企鹅眼睛 -->
  <circle cx="160" cy="120" r="25" fill="#fff"/>
  <circle cx="240" cy="120" r="25" fill="#fff"/>
  <circle cx="160" cy="120" r="12" fill="#000"/>
  <circle cx="240" cy="120" r="12" fill="#000"/>
  
  <!-- 企鹅嘴巴 -->
  <ellipse cx="200" cy="160" rx="50" ry="30" fill="#ffa500"/>
  
  <!-- 企鹅红围巾 -->
  <path d="M 140 180 Q 140 210 200 220 Q 260 210 260 180" fill="#e63946" stroke="#000" stroke-width="2"/>
  <rect x="200" y="200" width="30" height="50" fill="#e63946"/>
  
  <!-- 企鹅翅膀左 -->
  <ellipse cx="100" cy="250" rx="35" ry="80" fill="#000"/>
  <!-- 企鹅翅膀右 -->
  <ellipse cx="300" cy="250" rx="35" ry="80" fill="#000"/>
  
  <!-- 企鹅脚左 -->
  <ellipse cx="150" cy="420" rx="30" ry="20" fill="#ffa500"/>
  <!-- 企鹅脚右 -->
  <ellipse cx="250" cy="420" rx="30" ry="20" fill="#ffa500"/>
  
  <!-- 红底条幅 -->
  <rect x="50" y="360" width="300" height="70" fill="#e63946" rx="5"/>
  <text x="200" y="410" font-size="48" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial">找婆娘。</text>
</svg>